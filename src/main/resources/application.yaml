spring:
  application:
    name: movimenta-apoti

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

server:
  servlet:
    context-path: /api/v1

crypto:
  secret: ${CRYPTO_SECRET}
  standard: ${CRYPTO_STANDARD}
  algorithm: ${CRYPTO_ALGORITHM}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}

payment:
  gateway:
    url: ${GATEWAY_URL}
    token: ${GATEWAY_TOKEN}
    webhook: ${GATEWAY_WEBHOOK}